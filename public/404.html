<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#f7f5ef" />
    <title>404 · EsiBuy</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #172126;
        --muted: #536166;
        --paper: #f7f5ef;
        --orange: #e4683d;
        --orange-text: #b84a24;
        --line: #deddd5;
        font-family: Arial, Helvetica, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: flex;
        flex-direction: column;
        color: var(--ink);
        background: var(--paper);
      }
      header {
        display: flex;
        min-height: 76px;
        align-items: center;
        justify-content: space-between;
        padding: 0 clamp(20px, 6vw, 80px);
        border-bottom: 1px solid #263452;
        background: #0d162d;
      }
      header img {
        display: block;
        width: 142px;
        height: auto;
      }
      header a {
        color: #fff;
        font-size: 14px;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 3px solid var(--orange);
        outline-offset: 4px;
      }
      header a:hover {
        color: #ff9f43;
        text-decoration: underline;
      }
      main {
        display: flex;
        flex: 1;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 48px 24px 64px;
        text-align: center;
      }
      .art {
        display: flex;
        align-items: center;
        height: clamp(150px, 24vw, 220px);
        margin-bottom: 26px;
      }
      .number {
        font:
          700 clamp(130px, 23vw, 210px)/0.8 Georgia,
          'Times New Roman',
          serif;
        letter-spacing: -0.12em;
      }
      .number:last-child {
        color: var(--orange);
      }
      .bag {
        position: relative;
        display: grid;
        width: clamp(88px, 13vw, 122px);
        height: clamp(100px, 15vw, 138px);
        place-items: center;
        margin-right: 4px;
        border: 3px solid var(--ink);
        border-radius: 9px 9px 18px 18px;
        background: #f8e2d6;
        box-shadow: 8px 10px 0 var(--line);
        transform: rotate(-5deg);
      }
      .handle {
        position: absolute;
        top: -24px;
        left: 50%;
        width: 42px;
        height: 35px;
        border: 3px solid var(--ink);
        border-bottom: 0;
        border-radius: 24px 24px 0 0;
        transform: translateX(-50%);
      }
      .logo-letter {
        color: var(--orange-text);
        font:
          italic 700 clamp(68px, 9vw, 92px)/1 Georgia,
          'Times New Roman',
          serif;
      }
      .eyebrow {
        margin: 0 0 12px;
        color: var(--orange-text);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      h1 {
        max-width: 740px;
        margin: 0 0 16px;
        font:
          400 clamp(34px, 5.4vw, 56px)/1.05 Georgia,
          'Times New Roman',
          serif;
        letter-spacing: -0.04em;
      }
      h1 em {
        color: var(--orange-text);
      }
      .copy {
        max-width: 520px;
        margin: 0;
        color: var(--muted);
        font-size: 16px;
        line-height: 1.65;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 14px 24px;
        margin-top: 30px;
      }
      .button {
        display: inline-flex;
        min-height: 48px;
        align-items: center;
        justify-content: center;
        padding: 0 24px;
        border: 1px solid var(--ink);
        border-radius: 5px;
        color: #fff;
        background: var(--ink);
        font-size: 15px;
        font-weight: 700;
        text-decoration: none;
      }
      .button:hover {
        border-color: #c8512a;
        background: #c8512a;
      }
      .link {
        display: inline-flex;
        min-height: 48px;
        align-items: center;
        color: var(--ink);
        font-size: 15px;
        font-weight: 700;
        text-decoration-color: var(--orange);
        text-decoration-thickness: 2px;
        text-underline-offset: 5px;
      }
      .link:hover {
        color: var(--orange-text);
      }
      footer {
        padding: 18px 24px;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 12px;
        text-align: center;
      }
      @media (max-width: 560px) {
        header img {
          width: 120px;
        }
        main {
          padding: 36px 20px 48px;
        }
        .copy {
          font-size: 15px;
        }
        .actions {
          flex-direction: column;
          gap: 8px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <a href="/" aria-label="EsiBuy, ir al inicio"
        ><img src="/assets/images/svg/logo.svg" alt="EsiBuy" width="142" height="48"
      /></a>
      <a href="/products">Ver catálogo</a>
    </header>
    <main>
      <div class="art" aria-hidden="true">
        <span class="number">4</span>
        <span class="bag"><span class="handle"></span><span class="logo-letter">e</span></span>
        <span class="number">4</span>
      </div>
      <p class="eyebrow">Error 404 · Página no encontrada</p>
      <h1>Vaya, esta página <em>no está en la cesta.</em></h1>
      <p class="copy">
        Puede que el enlace haya cambiado o que la dirección no sea correcta. Volvamos a encontrar
        lo que buscas.
      </p>
      <nav class="actions" aria-label="Qué quieres hacer ahora">
        <a class="button" href="/products">Explorar el catálogo</a>
        <a class="link" href="/">Volver al inicio</a>
      </nav>
    </main>
    <footer>© 2026 EsiBuy · Equipo 5</footer>
  </body>
</html>
